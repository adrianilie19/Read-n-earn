<div class="login-container">
    <div class="caja-login">

        <form (ngSubmit)="onLogin()" #formLogin="ngForm">

            <div class="grupo-formulario">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="ejemplo@correo.com" required autocomplete="email">
            </div>

            <div class="grupo-formulario">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Introduce tu contraseña" required autocomplete="current-password">
            </div>

            <button type="submit" [disabled]="formLogin.invalid">Iniciar sesión</button>

            <p>¿Aún no tienes cuenta?<a href="/register">Crear una cuenta</a></p>

        </form>

    </div>
</div>
